version: 2

sources:
  - name: retailpulse_warehouse
    description: "RetailPulse dimensional warehouse and pipeline metadata stored in PostgreSQL."
    schema: public

    tables:
      - name: fact_sales
        description: "Sales fact table containing order-level measures and dimension keys."
        columns:
          - name: order_id
            description: "Unique identifier for the sales order."
          - name: date_key
            description: "Foreign key to the date dimension."
          - name: product_key
            description: "Foreign key to the product dimension."
          - name: category_key
            description: "Foreign key to the category dimension."
          - name: quantity
            description: "Number of units sold."
          - name: unit_price
            description: "Price per unit."
          - name: total_sales
            description: "Total sales value for the order."
          - name: pipeline_run_id
            description: "Identifier of the RetailPulse pipeline run."

      - name: dim_product
        description: "Product dimension containing product attributes."
        columns:
          - name: product_key
            description: "Unique surrogate key for the product."
          - name: product_name
            description: "Name of the product."
          - name: category_key
            description: "Foreign key to the category dimension."

      - name: dim_category
        description: "Category dimension containing product category attributes."
        columns:
          - name: category_key
            description: "Unique surrogate key for the category."
          - name: category_name
            description: "Name of the product category."

      - name: dim_date
        description: "Date dimension containing calendar attributes."
        columns:
          - name: date_key
            description: "Surrogate key representing the date."
          - name: full_date
            description: "Calendar date."
          - name: year
            description: "Calendar year."
          - name: month
            description: "Calendar month number."
          - name: month_name
            description: "Calendar month name."
          - name: quarter
            description: "Calendar quarter."
          - name: day
            description: "Day of the month."
          - name: day_of_week
            description: "ISO day of the week."
          - name: day_name
            description: "Name of the day."

      - name: pipeline_runs
        description: "Pipeline execution metadata and record-level processing statistics."
        columns:
          - name: run_id
            description: "Unique identifier for the pipeline run."
          - name: pipeline_name
            description: "Name of the pipeline."
          - name: source_file
            description: "Source file processed by the pipeline."
          - name: source_hash
            description: "SHA-256 hash of the source file."
          - name: status
            description: "Final status of the pipeline run."
          - name: started_at
            description: "Timestamp when the pipeline run started."
          - name: completed_at
            description: "Timestamp when the pipeline run completed."
          - name: records_received
            description: "Number of records received from the source."
          - name: records_accepted
            description: "Number of records accepted for processing."
          - name: records_rejected
            description: "Number of records rejected by validation."
          - name: records_processed
            description: "Number of records successfully processed."
          - name: error_message
            description: "Error message recorded for failed runs."