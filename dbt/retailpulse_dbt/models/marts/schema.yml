version: 2
models:
  - name: sales_summary
    description: "Overall sales performance summary."
    columns:
      - name: total_orders
        description: "Total number of sales orders."
      - name: total_quantity
        description: "Total number of units sold."
      - name: total_sales
        description: "Total sales value across all orders."
      - name: average_order_value
        description: "Average sales value per order."
  - name: sales_by_product
    description: "Sales performance aggregated by product."
    columns:
      - name: product
        description: "Name of the product."
      - name: total_quantity
        description: "Total units sold for the product."
      - name: total_sales
        description: "Total sales value generated by the product."
      - name: total_orders
        description: "Number of orders containing the product."
  - name: sales_by_category
    description: "Sales performance aggregated by product category."
    columns:
      - name: category
        description: "Product category."
      - name: total_quantity
        description: "Total units sold in the category."
      - name: total_sales
        description: "Total sales value generated by the category."
      - name: total_orders
        description: "Number of orders in the category."
  - name: sales_by_date
    description: "Daily sales performance."
    columns:
      - name: order_date
        description: "Date of the sales activity."
      - name: total_quantity
        description: "Total units sold on the date."
      - name: total_sales
        description: "Total sales value generated on the date."
      - name: total_orders
        description: "Number of orders on the date."
