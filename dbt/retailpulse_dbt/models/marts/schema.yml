version: 2

models:
  - name: sales_summary
    description: "Overall sales summary."

    columns:
      - name: total_orders
        description: "Total number of distinct orders."

      - name: total_quantity
        description: "Total quantity of units sold."

      - name: total_sales
        description: "Total sales value."

      - name: average_order_value
        description: "Average sales value per order."

  - name: sales_by_product
    description: "Sales performance summarized by product."

    columns:
      - name: product_name
        description: "Name of the product."

      - name: total_quantity
        description: "Total quantity sold for the product."

      - name: total_sales
        description: "Total sales value for the product."

      - name: total_orders
        description: "Number of distinct orders for the product."

  - name: sales_by_category
    description: "Sales performance summarized by product category."

    columns:
      - name: category_name
        description: "Name of the product category."

      - name: total_quantity
        description: "Total quantity sold for the category."

      - name: total_sales
        description: "Total sales value for the category."

      - name: total_orders
        description: "Number of distinct orders for the category."

  - name: sales_by_date
    description: "Sales performance summarized by date."

    columns:
      - name: full_date
        description: "Calendar date."

      - name: order_year
        description: "Calendar year."

      - name: order_month
        description: "Calendar month."

      - name: order_quarter
        description: "Calendar quarter."

      - name: total_quantity
        description: "Total quantity sold on the date."

      - name: total_sales
        description: "Total sales value on the date."

      - name: total_orders
        description: "Number of distinct orders on the date."