version: 2

models:
  - name: int_sales
    description: "Intermediate sales model built from the warehouse fact table."

    columns:
      - name: order_id
        description: "Unique identifier for the sales order."

      - name: date_key
        description: "Foreign key to the date dimension."

      - name: product_key
        description: "Foreign key to the product dimension."

      - name: category_key
        description: "Foreign key to the category dimension."

      - name: quantity
        description: "Number of units sold."

      - name: unit_price
        description: "Price per unit."

      - name: total_sales
        description: "Total sales value for the order."

      - name: pipeline_run_id
        description: "Identifier of the RetailPulse pipeline run."