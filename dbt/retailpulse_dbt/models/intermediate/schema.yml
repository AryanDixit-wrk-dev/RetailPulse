version: 2
models:
  - name: int_sales
    description: "Intermediate sales model containing cleaned sales records and calculated sales value."
    columns:
      - name: order_id
        description: "Unique identifier for the sales order."
      - name: product
        description: "Name of the product sold."
      - name: category
        description: "Product category."
      - name: quantity
        description: "Number of units sold."
      - name: price
        description: "Price per unit."
      - name: order_date
        description: "Date on which the order was placed."
      - name: total_sales
        description: "Total sales value calculated as quantity multiplied by price."
